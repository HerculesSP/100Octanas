<body onload="buscarMaterias()">
     <section class="navigation">
        <div class="nav-container">

        <nav>

                    <a href="#">Gerenciamento</a>
                    <ul class="nav-dropdown">
                        <li>
                            <a href="dashboard/dashboard-usuarios.html">Dashboard Usuários</a>
                        </li>
                        <li>
                            <a href="dashboard/dashboard-materias.html">Dashboard Matérias</a>
                        </li>
                        <li>

                        </li>
                    </ul>
                </li>
                <li>
                    <div class="nav-user">
                        <img src="res/icon/default-icon.png" alt="Avatar do usuário" class="user-avatar">

                        <li>

            </ul>
        </nav>
    </div>
    </section>
    <div class="container-geral">
        <div class="container-busca">
            <div class="container-ordenar">
                <label for="ordenar">Ordenar por:</label>
                <select id="ordenar"class="dropdown" onchange="buscarMaterias()">
                    <option value="data">Mais recentes</option>
                    <option value="recomendados">Recomendados</option>
                    <option value="acessos desc">Mais acessadas</option>
                </select>
            </div>
            <div class="search-box">
                <input type="text" class="search-txt" id="termo_pesquisa" placeholder="Pesquisar" oninput="buscarMaterias()">
            </div>
        </div>
        <div class="resultados" id="resultados">
           
        </div>
    </div>
      <footer class="footer">
            <div class="footer-container">
                <span class="footer-brand">100 Octanas</span>
                <ul class="footer-links">
                    <li><a href="index.html">Início</a></li>
                    <li><a href="noticias.html">Notícias</a></li>
                </ul>
                <div class="footer-social">
                    <a href="#"><img src="assets/icon/facebook.png" alt="Facebook"></a>
                    <!-- https://uxwing.com/facebook-app-round-white-icon/-->
                    <a href="#"><img src="assets/icon/twitter.png" alt="Twitter"></a>
                    <!--https://uxwing.com/x-social-media-white-icon/-->
                    <a href="#"><img src="assets/icon/instagram.png" alt="Instagram"></a>
                    <!--https://uxwing.com/instagram-white-icon/-->
            </div>
    </footer>
</body>
<script>
function buscarMaterias(){
    let pesquisa = termo_pesquisa.value
    let ordem = ordenar.value;
    if (pesquisa == ''){
        pesquisa = ``;
    } 

    fetch(`materias/listarMaterias?ordem=${ordem}&pesquisa=${pesquisa}&limit=100`)
    .then(response => {
      if (response.ok) {
        response.json().then(resposta => {
            console.log(resposta)
            exibirMaterias(resposta)
        });
      } else {
        console.error('Nenhuma matéria encontrada ou erro na API');
      }
    })
    .catch(error => {
      console.error(`Erro na obtenção das matérias para exibir: ${error.message}`);
    });
}
function exibirMaterias(materias){
    resultados.innerHTML=''
    for (let i=0; i<materias.length; i++){
        const data = new Date(materias[i].data).toLocaleDateString('pt-BR');
        resultados.innerHTML += `
            <a href="javascript:redirecionarUsuario(${materias[i].id}, ${sessionStorage.ID_USUARIO}, '${materias[i].link}')">
                <div class="resultados-card">
                    <div class="imagem">
                        <img src="res/img/${materias[i].capa}">
                    </div>
                    <div class="estrutura">
                        <div class="informacoes">
                            <span class="titulo-card">${materias[i].titulo}</span>
                            <span class="resumo-card">${materias[i].resumo}</span>
                        </div>
                        <div class="data">
                            <span class="data-card">Publicado em ${data}</span>
                        </div>
                    </div>
                </div>
            </a>`
    }
}
function redirecionarUsuario(idMateria, idUsuario, link){
    const dados = {
        idMateria: idMateria,
        idUsuario: idUsuario
    };
    fetch("/materias/inserirInformacoes", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(dados)
    })
      .then(function (resposta) {
        console.log("resposta: ", resposta);
        if (resposta.ok) {
          console.log(
            "Cadastro da notícia realizado com sucesso! Redirecionando para a matéria..");
            window.location = `./res/materias/${link}.html`;
        } else {
          throw "Houve um erro ao salvar as matérias no banco!";
        }
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
      });

    return false;
}
</script>

</html>
