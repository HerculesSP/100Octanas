 <div class="login">
    <div class="container">
      <div class="card card-login">
        <h2>Olá novamente!</h2>
        <div class="forms">
            <div class="campo">
              <span>E-mail:</span>
              <input id="input_email" type="text" placeholder="exemplo@email.com" oninput="email()"/>
              <div id="invalid_email" class="invalid-feedback">Insira o Email</div>
            </div> 
            <div class="campo">
              <span>Senha:</span>
              <input id="input_password" type="password" placeholder="******" oninput="password()"/>
              <div id="invalid_password" class="invalid-feedback">Insira a Senha</div>
            </div>
            <button class="credential-submit" id="login_submit_button" onclick="checkAllLoginSubmit()" onmouseover="checkAllLogin()">Entrar</button>
            <div id="invalid_data" class="invalid-feedback"></div>
            <div class="login-redirect">
              <p>Ainda não tem uma conta? <a href="cadastro.html">Cadastre-se</a></p>
          </div>   
        </div>
      </div>

<script src="./js/sessao.js"></script>

<script>

function email(){
    let text = input_email.value;
    let haveAt = text.indexOf('@');
    if(haveAt == -1){
        input_email.style.border = "2px solid red";
        invalid_email.innerHTML = "<img src='../assets/icon/denied.png'> <span class='denied'> Email Inválido! </span>";
        return false;
    }else{
        input_email.style.border = "2px solid green";
        invalid_email.innerHTML = "<img src='../assets/icon/accept.png'> <span class='accept'> Email Ok! </span>";
        return true;
    }
}
function password(){
    var password= input_password.value;
    let passwordLength = password.length;
    let haveNumber = /\d/.test(password);
    let haveSpecial = /[!@#$%^&*(),.?":{}|<>]/.test(password);
    let haveLower = /[a-z]/.test(password);
    let haveUpper = /[A-Z]/.test(password);
    if(passwordLength < 8 || passwordLength > 20){
        input_password.style.border = "2px solid red";
        invalid_password.innerHTML = "<img src='../assets/icon/denied.png'> <span class='denied'> A senha deve ter entre 8 e 20 dígitos! </span>";
        return false;
    } else if(!haveNumber || !haveSpecial || !haveLower || !haveUpper){
        input_password.style.border = "2px solid red";
        invalid_password.innerHTML = "<img src='../assets/icon/denied.png'> <span class='denied'> A senha deve conter letras maiúsculas, minúsculas, números e caracteres especiais! </span>";
        return false;
    } else{
        input_password.style.border = "2px solid green";
        invalid_password.innerHTML = "<img src='../assets/icon/accept.png'> <span class='accept'> Senha Ok! </span>";
        return true;
    }
}

function checkAllLogin(){
    let emailValid = email();
    let passwordValid = password();
    if(emailValid && passwordValid){
        login_submit_button.disabled = false;
        login_submit_button.style.cursor = "pointer";
        return true;
    }else{
        login_submit_button.disabled = true;
        login_submit_button.style.cursor = "not-allowed";
        return false;
    }
}

function checkAllLoginSubmit(){
    var emailVar = input_email.value;
    var senhaVar = input_password.value;
    console.log("FORM LOGIN: ", emailVar);
    console.log("FORM SENHA: ", senhaVar);
    let validAll = checkAllLogin();
        if (validAll=0) {
            return;
        }
        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: emailVar,
                senhaServer: senhaVar
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {
                    console.log('foi')
                    console.log(json);
                    console.log(JSON.stringify(json));
                    sessionStorage.ID_USUARIO = json.idUsuario;
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.NOME_USUARIO = json.nome;
                    sessionStorage.SOBRENOME_USUARIO = json.sobrenome;
                    sessionStorage.VERIFICADO = json.verificado;
                    sessionStorage.CARGO = json.descricao;
                    sessionStorage.FOTO = json.icon;
                     window.location = "./index.html";

                });

            } else {
                input_password.value="";
                invalid_password.innerHTML = '';
                invalid_email.innerHTML = '';
                input_password.style.border = "2px solid red";
                input_email.style.border = "2px solid red";
                input_password.style.border = "2px solid green";
                invalid_data.innerHTML = "<img src='../assets/icon/denied.png'> <span class='denied'> Email ou Senha inválidos! </span>";
                console.log("Houve um erro ao tentar realizar o login!");
                input_password.style.border = "2px solid red";
                resposta.text().then(texto => {
                    console.error(texto);
                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })

        return false;
    }
</script>
