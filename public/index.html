<script>
const slides = ['slide1', 'slide2', 'slide3'];
let atual = 0;
let intervalo = setInterval(proximoSlide, 7000);

function mostrarSlide(indice) {
  document.getElementById(slides[indice]).checked = true;
  atual = indice;
}

function proximoSlide() {
  atual = (atual + 1) % slides.length;
  mostrarSlide(atual);
}

function anteriorSlide() {
  atual = (atual - 1 + slides.length) % slides.length;
  mostrarSlide(atual);
}

function proximo() {
  proximoSlide();
  reiniciarIntervalo();
};
function anterior() {
  anteriorSlide();
  reiniciarIntervalo();
};

function reiniciarIntervalo() {
  clearInterval(intervalo);
  intervalo = setInterval(proximoSlide, 7000);
}
function buscarPopulares(){
    fetch(`materias/listarMaterias?ordem=acessos&pesquisa=&limit=3`)
    .then(response => {
      if (response.ok) {
        response.json().then(resposta => {
            exibirSlides(resposta);
        });
      } else {
        console.error('Nenhuma matéria encontrada ou erro na API');
      }
    })
    .catch(error => {
      console.error(`Erro na obtenção das matérias para exibir: ${error.message}`);
    });
}

function exibirSlides(materias) {
   const carrossel = document.getElementById('carrossel-db');
  if (!carrossel){ 
    return;
  }
  let radios = '';
  let slides = '';

  materias.forEach((materia, index) => {
    const checked = index === 0 ? 'checked' : '';
    const data = new Date(materia.data).toLocaleDateString('pt-BR');
    radios += `<input type="radio" name="carrossel" id="slide${index+1}" style="display:none;" ${checked}>`;
    slides += `
    <a href="javascript:redirecionarUsuario(${materias[index].id}, ${sessionStorage.ID_USUARIO}, '${materias[index].link}')">
      <div class="slide s${index+1}">
        <div class="slide-conteudo">
          <div class="slide-imagem">
            <img src="res/img/${materia.capa}" alt="${materia.titulo}">
          </div>
          <div class="slide-info">
            <div class="titulo">${materia.titulo}</div>
            <div class="data">Publicado em: ${data}</div>
          </div>
        </div>
      </div>
      </a>
    `;
  });

  const botoes = `
    <button class="seta esquerda" onclick="mudarSlide(-1)">
      <img src="https://cdn-icons-png.flaticon.com/512/271/271220.png" alt="Anterior" />
    </button>
    <button class="seta direita" onclick="mudarSlide(1)">
      <img src="https://cdn-icons-png.flaticon.com/512/271/271228.png" alt="Próximo" />
    </button>
  `;

  carrossel.innerHTML = radios + `<div class="slides">` + slides + `</div>` + botoes;
}

function mudarSlide(direcao) {
  const radios = Array.from(document.querySelectorAll('input[name="carrossel"]'));
  const atual = radios.findIndex(r => r.checked);
  let novo = atual + direcao;
  if (novo < 0) novo = radios.length - 1;
  if (novo >= radios.length) novo = 0;
  radios[novo].checked = true;
}
function buscarRecentes(){
    fetch(`materias/listarMaterias?ordem=data&pesquisa=&limit=3`)
    .then(response => {
      if (response.ok) {
        response.json().then(resposta => {
            console.log(resposta)
            exibirMaterias(resposta)
        });
      } else {
        console.error('Nenhuma matéria encontrada ou erro na API');
      }
    })
    .catch(error => {
      console.error(`Erro na obtenção das matérias para exibir: ${error.message}`);
    });
}
function exibirMaterias(materias){
    resultados.innerHTML=''
    for (let i=0; i<materias.length; i++){
        const data = new Date(materias[i].data).toLocaleDateString('pt-BR');
        resultados.innerHTML += `
            <a href="javascript:redirecionarUsuario(${materias[i].id}, ${sessionStorage.ID_USUARIO}, '${materias[i].link}')">
                <div class="resultados-card">
                    <div class="imagem">
                        <img src="res/img/${materias[i].capa}">
                    </div>
                    <div class="estrutura">
                        <div class="informacoes">
                            <span class="titulo-card">${materias[i].titulo}</span>
                        </div>
                        <div class="data">
                            <span class="data-card">Publicado em ${data}</span>
                        </div>
                    </div>
                </div>
            </a>`
    }
}
function redirecionarUsuario(idMateria, idUsuario, link){
    if (idUsuario==undefined){
       window.location = `./login.html`;
       return
    }
    const dados = {
        idMateria: idMateria,
        idUsuario: idUsuario
    };
    fetch("/materias/inserirInformacoes", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(dados)
    })
      .then(function (resposta) {
        console.log("resposta: ", resposta);
        if (resposta.ok) {
          console.log(
            "Cadastro da notícia realizado com sucesso! Redirecionando para a matéria..");
            window.location = `./res/materias/${link}.html`;
        } else {
          throw "Houve um erro ao salvar as matérias no banco!";
        }
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
      });

    return false;
}
</script>
